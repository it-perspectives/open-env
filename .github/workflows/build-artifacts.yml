name: Build distributable artifacts
on:
  workflow_call:
permissions:
  contents: read
jobs:
  website-image:
    name: Website Docker image
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 24
      - uses: docker/setup-buildx-action@v4
      - name: Build website image
        uses: docker/build-push-action@v7
        with:
          context: .
          file: website/Dockerfile
          platforms: linux/amd64
          tags: openenv-website:${{ github.sha }}
          push: false
          load: true
          provenance: false
          cache-from: type=gha,scope=openenv-website
          cache-to: type=gha,mode=max,scope=openenv-website
      - name: Test website container
        run: node scripts/smoke-website-image.js "openenv-website:$GITHUB_SHA"
      - name: Export Docker image
        run: |
          mkdir -p dist
          docker save "openenv-website:$GITHUB_SHA" | gzip > dist/openenv-website-linux-amd64.tar.gz
      - name: Store Docker image artifact
        uses: actions/upload-artifact@v7
        with:
          name: openenv-website-${{ github.sha }}-linux-amd64
          path: dist/openenv-website-linux-amd64.tar.gz
          if-no-files-found: error
          compression-level: 0
          retention-days: 14
  vscode-extension:
    name: VS Code extension VSIX
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: npm
      - run: npm ci --ignore-scripts
      - run: npm run vscode:package
      - name: Store VSIX artifact
        uses: actions/upload-artifact@v7
        with:
          name: openenv-${{ github.sha }}
          path: dist/openenv-*.vsix
          if-no-files-found: error
          compression-level: 0
          retention-days: 14
