name: Release OpenENV
on:
  push:
    tags: ['specification-v*', 'website-v*']
permissions:
  contents: write
  id-token: write
  packages: write
jobs:
  release:
    # open-tooling v0.1.0; extension tags use release-extension.yml for publisher identity.
    uses: it-perspectives/open-tooling/.github/workflows/release.yml@0ac78fd5a1bc8c567d453e36e8e13224df62d74d
    with:
      tooling-ref: 0ac78fd5a1bc8c567d453e36e8e13224df62d74d
      require-complete: true
