name: Release Open ENV extension
on:
  push:
    tags: ['extension-v*']
permissions:
  contents: read
concurrency:
  group: release-extension-${{ github.ref }}
  cancel-in-progress: false
jobs:
  prepare:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: npm
      - run: npm ci --ignore-scripts
      - run: node scripts/vscode-release.js check
      - run: npm run verify
      - run: npm run previews:verify
      - run: npm run vscode:package
      - run: xvfb-run -a npm run vscode:test
        env:
          OPENENV_VSCODE_VERSION: '1.100.0'
      - run: node scripts/vscode-release.js stage
        env:
          GH_TOKEN: ${{ github.token }}
  publish:
    needs: prepare
    runs-on: ubuntu-latest
    timeout-minutes: 15
    strategy:
      fail-fast: false
      matrix:
        store: [marketplace, openvsx]
    permissions:
      contents: write
      id-token: write
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: npm
      - run: npm ci --ignore-scripts
      - run: node scripts/vscode-release.js publish "${{ matrix.store }}"
        env:
          GH_TOKEN: ${{ github.token }}
  finalize:
    needs: publish
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: npm
      - run: npm ci --ignore-scripts
      - run: node scripts/vscode-release.js finalize
        env:
          GH_TOKEN: ${{ github.token }}
