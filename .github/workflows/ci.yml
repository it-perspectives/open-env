name: Validate OpenENV
on:
  push:
    branches: [main]
  pull_request:
permissions:
  contents: read
jobs:
  verify:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        node: [22, 24]
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: ${{ matrix.node }}
          cache: npm
      - run: npm ci --ignore-scripts
      - run: npm run release:prepare
      - run: node scripts/smoke-package.js
  website:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm
      - run: npm ci --ignore-scripts
      - run: npm run format:check --workspace @openenv/website
      - run: npm run site:check
      - run: npm run previews:verify
  extension-host:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        vscode: ["1.100.0", "stable"]
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: npm
      - run: npm ci --ignore-scripts
      - run: npm run vscode:package
      - run: xvfb-run -a npm run vscode:test
        env:
          OPENENV_VSCODE_VERSION: ${{ matrix.vscode }}
  artifacts:
    needs: [verify, website, extension-host]
    uses: ./.github/workflows/build-artifacts.yml
